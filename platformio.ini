; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:dueUSB]
platform = atmelsam
board = dueUSB
framework = arduino
board_build.usb_product = ARB, native USB
board_vendor = GAA Custom Electronics, LLC
; MemoryFix.cpp replaces the core's _sbrk (malloc returns NULL when out of memory).
; The project object links first, so its definition is the one kept.
build_flags =
    -Wl,--allow-multiple-definition
lib_deps =
    https://github.com/delsauce/ArduinoDueParallel.git
; Copies the built firmware to firmware/ARB-V<version>.bin
extra_scripts =
    post:rename_firmware.py
